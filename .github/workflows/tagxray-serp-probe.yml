name: tagX-ray SERP Probe

on:
  workflow_dispatch:
  push:
    branches: ["tagxray-build-20260821"]
    paths: [".github/workflows/tagxray-serp-probe.yml"]
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/tagxray-serp-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Naver exact SKU result payload
        shell: bash
        run: |
          node <<'NODE'
          const query='005DO0005 리바이스';
          const url=`https://m.search.naver.com/search.naver?query=${encodeURIComponent(query)}`;
          const r=await fetch(url,{redirect:'follow',headers:{
            'user-agent':'Mozilla/5.0 (Linux; Android 14; SM-S928N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36',
            'accept-language':'ko-KR,ko;q=0.9,en;q=0.7',
            'accept':'text/html,application/xhtml+xml,*/*;q=0.8',
          }});
          const t=await r.text();
          console.log(`status=${r.status} len=${t.length} final=${r.url}`);
          const needles=['005DO0005','levi.co.kr','lotteon.com','gmarket.co.kr','hmall.com','e-himart.co.kr'];
          for(const needle of needles){
            console.log(`\n### ${needle}`);
            let pos=0,count=0;
            while((pos=t.toLowerCase().indexOf(needle.toLowerCase(),pos))>=0&&count<8){
              console.log(`-- hit ${count+1} @ ${pos}`);
              console.log(t.slice(Math.max(0,pos-700),Math.min(t.length,pos+1200)).replace(/\s+/g,' '));
              pos+=needle.length; count++;
            }
          }
          const hrefs=[...t.matchAll(/href=(?:"|')([^"']+)(?:"|')/gi)].map(m=>m[1].replace(/&amp;/g,'&'));
          console.log('\n### href candidates');
          for(const h of [...new Set(hrefs)].filter(h=>/levi|lotteon|gmarket|hmall|himart/i.test(h)).slice(0,80)) console.log(h);
          NODE
