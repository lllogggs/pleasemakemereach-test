name: tagX-ray APK Build

on:
  push:
    branches: ["tagxray-build-20260821"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe retailer search pages
        shell: bash
        run: |
          node <<'NODE'
          const qs = [
            ['gmarket','https://www.gmarket.co.kr/n/search?keyword=005DO0005'],
            ['lotteon','https://www.lotteon.com/csearch/search/search?mallId=2&render=search&platform=m&q=005DO0005'],
            ['hmall','https://wwwca.hmall.com/'],
            ['himart','https://www.e-himart.co.kr/'],
          ];
          for (const [id,url] of qs) {
            try {
              const r = await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36','accept-language':'ko-KR,ko;q=0.9,en;q=0.6','accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'}});
              const t = await r.text();
              console.log(`=== ${id} status=${r.status} len=${t.length} final=${r.url}`);
              const patterns = ['005DO0005','005DO-0005','goodscode','slitmCd','goodsNo','__NEXT_DATA__','application/ld+json','productName','salePrice','price'];
              for (const p of patterns) console.log(`${p}:`, t.toLowerCase().includes(p.toLowerCase()));
              const hits=[...t.matchAll(/005do.{0,200}/ig)].slice(0,10).map(x=>x[0].replace(/\s+/g,' '));
              console.log('hits',JSON.stringify(hits));
            } catch (e) { console.log(`=== ${id} ERROR`, e?.stack||String(e)); }
          }
          NODE

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct original tagX-ray source archive
        run: |
          cat tagxray-parts/part-* > tagX-ray-source.b64
          base64 --decode tagX-ray-source.b64 > tagX-ray-source.zip
          echo "6e2e30d7eb343bf74a74c3c3fcaacfd68147f7669a25d7bad65f8c94d49c3480  tagX-ray-source.zip" | sha256sum --check

      - name: Unpack original source
        run: |
          rm -rf tagxray-build
          mkdir tagxray-build
          unzip -q tagX-ray-source.zip -d tagxray-build

      - name: Apply tagX-ray v0.2 patch
        run: |
          cat tagxray-diff4-parts/part-* > tagxray-v02.diff.gz.b64
          base64 --decode tagxray-v02.diff.gz.b64 > tagxray-v02.diff.gz
          echo "cbed60d7eec82110d5c7c3f5e6cff9bc13ce04dca4a36de6a9c117f2b28a64b3  tagxray-v02.diff.gz" | sha256sum --check
          gzip -dc tagxray-v02.diff.gz > tagxray-v02.diff
          echo "a26cb926dc196641a4c7a6834916507d1eb03d0d7ac4dd475b41e77c412e9a4e  tagxray-v02.diff" | sha256sum --check
          cd tagxray-build/tagxray-app
          patch -p1 < ../../tagxray-v02.diff

      - name: Install dependencies
        working-directory: tagxray-build/tagxray-app
        run: npm install

      - name: Typecheck
        working-directory: tagxray-build/tagxray-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: tagxray-build/tagxray-app
        run: npm run test

      - name: Expo doctor
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo-doctor@latest
        continue-on-error: true

      - name: Prebuild Android
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: tagxray-build/tagxray-app/apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp tagxray-build/tagxray-app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk tagX-ray-v0.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tagX-ray-v0.2.0-apk
          path: tagX-ray-v0.2.0.apk
          if-no-files-found: error
          retention-days: 7
