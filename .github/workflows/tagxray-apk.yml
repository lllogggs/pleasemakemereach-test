name: tagX-ray APK Build

on:
  push:
    branches: ["tagxray-build-20260821"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact v0.2 source archive
        run: |
          test -f tagxray-v02/tagX-ray-source-v0.2.0.zip
          unzip -t tagxray-v02/tagX-ray-source-v0.2.0.zip >/dev/null
          sha256sum tagxray-v02/tagX-ray-source-v0.2.0.zip

      - name: Unpack tagX-ray v0.2 source
        run: |
          rm -rf tagxray-build
          mkdir tagxray-build
          unzip -q tagxray-v02/tagX-ray-source-v0.2.0.zip -d tagxray-build
          test -f tagxray-build/tagxray-app/package.json

      - name: Install dependencies
        working-directory: tagxray-build/tagxray-app
        run: npm install

      - name: Typecheck
        working-directory: tagxray-build/tagxray-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: tagxray-build/tagxray-app
        run: npm run test

      - name: Expo doctor
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo-doctor@latest
        continue-on-error: true

      - name: Prebuild Android
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: tagxray-build/tagxray-app/apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp tagxray-build/tagxray-app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk tagX-ray-v0.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tagX-ray-v0.2.0-apk
          path: tagX-ray-v0.2.0.apk
          if-no-files-found: error
          retention-days: 7
