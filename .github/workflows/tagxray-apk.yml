name: tagX-ray APK Build

on:
  push:
    branches: ["tagxray-build-20260821"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct original tagX-ray source
        run: |
          cat tagxray-parts/part-* > tagX-ray-source.b64
          base64 --decode tagX-ray-source.b64 > tagX-ray-source.zip
          echo "6e2e30d7eb343bf74a74c3c3fcaacfd68147f7669a25d7bad65f8c94d49c3480  tagX-ray-source.zip" | sha256sum --check
          unzip -t tagX-ray-source.zip >/dev/null

      - name: Unpack original source
        run: |
          rm -rf tagxray-build
          mkdir tagxray-build
          unzip -q tagX-ray-source.zip -d tagxray-build
          test -f tagxray-build/tagxray-app/package.json

      - name: Reconstruct and apply v0.2 patch
        run: |
          cat tagxray-v02-diffplain/part-* > tagxray-v02.diff
          echo "reconstructed patch bytes: $(wc -c < tagxray-v02.diff)"
          sha256sum tagxray-v02.diff
          cd tagxray-build/tagxray-app
          patch --batch --forward -p4 < ../../tagxray-v02.diff

      - name: Verify expected v0.2 files
        run: |
          test -f tagxray-build/tagxray-app/apps/mobile/src/RetailerWebSearch.tsx
          test -f tagxray-build/tagxray-app/apps/mobile/src/searchMerge.ts
          grep -q 'react-native-webview' tagxray-build/tagxray-app/apps/mobile/package.json
          grep -q 'idx_scan_history_product_unique' tagxray-build/tagxray-app/apps/mobile/src/db.ts
          grep -q 'formatHistoryDate' tagxray-build/tagxray-app/apps/mobile/src/screens/HistoryScreens.tsx

      - name: Install dependencies
        working-directory: tagxray-build/tagxray-app
        run: npm install

      - name: Typecheck
        working-directory: tagxray-build/tagxray-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: tagxray-build/tagxray-app
        run: npm run test

      - name: Expo doctor
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo-doctor@latest
        continue-on-error: true

      - name: Prebuild Android
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: tagxray-build/tagxray-app/apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp tagxray-build/tagxray-app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk tagX-ray-v0.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tagX-ray-v0.2.0-apk
          path: tagX-ray-v0.2.0.apk
          if-no-files-found: error
          retention-days: 7
