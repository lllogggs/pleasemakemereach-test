name: tagX-ray APK Build

on:
  push:
    branches: ["tagxray-build-20260821"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe retailer search pages
        shell: bash
        run: |
          node <<'NODE'
          const qs = [
            ['gmarket','https://browse.gmarket.co.kr/search?keyword=005DO0005'],
            ['lotteon','https://www.lotteon.com/csearch/search/search?mallId=1&render=search&platform=m&q=005DO0005'],
            ['hmall','https://www.hmall.com/p/sm/search?searchTerm=005DO0005'],
            ['himart','https://www.e-himart.co.kr/app/search/search?query=005DO0005'],
          ];
          for (const [id,url] of qs) {
            try {
              const r = await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36','accept-language':'ko-KR,ko;q=0.9,en;q=0.6','accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'}});
              const t = await r.text();
              console.log(`=== ${id} status=${r.status} len=${t.length} final=${r.url}`);
              const patterns = ['005DO0005','005DO-0005','goodscode','slitmCd','goodsNo','__NEXT_DATA__','application/ld+json','productName','salePrice','price'];
              for (const p of patterns) console.log(`${p}:`, t.toLowerCase().includes(p.toLowerCase()));
              const hits=[...t.matchAll(/005do.{0,200}/ig)].slice(0,10).map(x=>x[0].replace(/\s+/g,' '));
              console.log('hits',JSON.stringify(hits));
            } catch (e) { console.log(`=== ${id} ERROR`, e?.stack||String(e)); }
          }
          NODE

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct tagX-ray source archive
        run: |
          cat tagxray-v02-parts/part-* > tagX-ray-source-v0.2.0.b64
          base64 --decode tagX-ray-source-v0.2.0.b64 > tagX-ray-source-v0.2.0.zip
          echo "7dacea165a70e52d455f570a784e668f90f82990fe35cebdfbb9a3bcf073b368  tagX-ray-source-v0.2.0.zip" | sha256sum --check

      - name: Unpack tagX-ray source
        run: |
          rm -rf tagxray-build
          mkdir tagxray-build
          unzip -q tagX-ray-source-v0.2.0.zip -d tagxray-build

      - name: Install dependencies
        working-directory: tagxray-build/tagxray-app
        run: npm install

      - name: Typecheck
        working-directory: tagxray-build/tagxray-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: tagxray-build/tagxray-app
        run: npm run test

      - name: Expo doctor
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo-doctor@latest
        continue-on-error: true

      - name: Prebuild Android
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: tagxray-build/tagxray-app/apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp tagxray-build/tagxray-app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk tagX-ray-v0.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tagX-ray-v0.2.0-apk
          path: tagX-ray-v0.2.0.apk
          if-no-files-found: error
          retention-days: 7
