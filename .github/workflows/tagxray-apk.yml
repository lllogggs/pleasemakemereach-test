name: tagX-ray APK Build

on:
  push:
    branches: ["tagxray-build-20260821"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct tagX-ray source archive
        run: |
          cat tagxray-parts/part-* > tagX-ray-source.b64
          base64 --decode tagX-ray-source.b64 > tagX-ray-source.zip
          echo "6e2e30d7eb343bf74a74c3c3fcaacfd68147f7669a25d7bad65f8c94d49c3480  tagX-ray-source.zip" | sha256sum --check

      - name: Unpack tagX-ray source
        run: |
          rm -rf tagxray-build
          mkdir tagxray-build
          unzip -q tagX-ray-source.zip -d tagxray-build

      - name: Install dependencies
        working-directory: tagxray-build/tagxray-app
        run: npm install

      - name: Typecheck
        working-directory: tagxray-build/tagxray-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: tagxray-build/tagxray-app
        run: npm run test

      - name: Expo doctor
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo-doctor@latest
        continue-on-error: true

      - name: Prebuild Android
        working-directory: tagxray-build/tagxray-app/apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: tagxray-build/tagxray-app/apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp tagxray-build/tagxray-app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk tagX-ray-v0.1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tagX-ray-v0.1.0-apk
          path: tagX-ray-v0.1.0.apk
          if-no-files-found: error
          retention-days: 7
