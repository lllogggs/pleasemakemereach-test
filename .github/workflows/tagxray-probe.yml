name: tagX-ray Retailer Probe

on:
  push:
    branches: ["tagxray-build-20260821"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe retailer search pages
        shell: bash
        run: |
          node <<'NODE'
          const qs = [
            ['gmarket','https://browse.gmarket.co.kr/search?keyword=005DO0005'],
            ['lotteon','https://www.lotteon.com/csearch/search/search?render=search&platform=m&q=005DO0005'],
            ['hmall','https://www.hmall.com/p/sm/search?searchTerm=005DO0005'],
            ['himart','https://www.e-himart.co.kr/app/search/search?query=005DO0005'],
          ];
          for (const [id,url] of qs) {
            try {
              const r = await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36','accept-language':'ko-KR,ko;q=0.9,en;q=0.6','accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'}});
              const t = await r.text();
              console.log(`=== ${id} status=${r.status} len=${t.length} final=${r.url}`);
              const patterns = ['005DO0005','005DO-0005','goodscode','LO','slitmCd','goodsNo','__NEXT_DATA__','application/ld+json','productName','salePrice','price'];
              for (const p of patterns) console.log(`${p}:`, t.toLowerCase().includes(p.toLowerCase()));
              const hits=[...t.matchAll(/005do.{0,120}/ig)].slice(0,8).map(x=>x[0].replace(/\s+/g,' '));
              console.log('hits',JSON.stringify(hits));
              const urls=[...t.matchAll(/https?:\\?\/\\?\/[^\"'<> ]+/g)].slice(0,20).map(x=>x[0]);
              console.log('sampleUrls',JSON.stringify(urls.slice(0,8)));
              console.log('prefix',JSON.stringify(t.slice(0,700).replace(/\s+/g,' ')));
            } catch (e) { console.log(`=== ${id} ERROR`, e?.stack||String(e)); }
          }
          NODE
